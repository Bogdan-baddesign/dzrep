name: Release

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  release:
    if: github.event.pull_request.merged == true
    name: Create Release & Update README
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "New version: $VERSION"

      - name: Fetch Chuck Norris joke
        id: joke
        run: |
          JOKE=$(curl -s https://api.chucknorris.io/jokes/random | jq -r '.value')
          echo "joke=$JOKE" >> $GITHUB_OUTPUT
          echo "Fetched joke: $JOKE"

      - name: Get PR title
        id: pr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "title=$PR_TITLE" >> $GITHUB_OUTPUT

      - name: Update README.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          JOKE: ${{ steps.joke.outputs.joke }}
        run: |
          RELEASE_BLOCK="## Latest Release Info
          - Version: $VERSION
          - PR Title: $PR_TITLE
          - Chuck Norris Joke: $JOKE"

          if grep -q "## Latest Release Info" README.md; then
            python3 -c "
          import re, sys, os
          content = open('README.md').read()
          new_block = os.environ['RELEASE_BLOCK'] if 'RELEASE_BLOCK' in os.environ else ''
          version = os.environ.get('VERSION', '')
          pr_title = os.environ.get('PR_TITLE', '')
          joke = os.environ.get('JOKE', '')
          new_block = f'## Latest Release Info\n- Version: {version}\n- PR Title: {pr_title}\n- Chuck Norris Joke: {joke}'
          pattern = r'## Latest Release Info.*?(?=\n## |\Z)'
          result = re.sub(pattern, new_block.strip(), content, flags=re.DOTALL)
          open('README.md', 'w').write(result)
          "
          else
            echo "" >> README.md
            echo "$RELEASE_BLOCK" >> README.md
          fi

          echo "README.md updated successfully"
          cat README.md

      - name: Commit updated README
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update release info to $VERSION [skip ci]"
          git push

      - name: Create git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag $VERSION
          git push origin $VERSION
          echo "Tag $VERSION created and pushed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## 🚀 Release ${{ steps.version.outputs.version }}

            **Merged PR:** ${{ steps.pr.outputs.title }}

            **Chuck Norris says:**
            > ${{ steps.joke.outputs.joke }}

            ---
            *Auto-generated by GitHub Actions*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment joke on PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 Release ${{ steps.version.outputs.version }} created!\n\n**Chuck Norris says:**\n> ${{ steps.joke.outputs.joke }}`
            })
